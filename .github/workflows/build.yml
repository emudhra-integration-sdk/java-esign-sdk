name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Ant
        run: |
          ant clean jar \
            -Dfile.reference.batik-all-1.13.jar=lib/batik-all-1.13.jar \
            -Dfile.reference.commons-io-2.4.jar=lib/commons-io-2.4.jar \
            -Dfile.reference.org.w3c.dom.svg-1.1.0.jar=lib/org.w3c.dom.svg-1.1.0.jar \
            -Dfile.reference.xmlgraphics-commons-2.4.jar=lib/xmlgraphics-commons-2.4.jar

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eSignASPLibrary5_5
          path: dist/eSignASPLibrary5_5.jar
          retention-days: 90

      - name: Read version
        if: github.event_name == 'push'
        id: version
        run: echo "value=v$(cat version.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: eSign SDK ${{ steps.version.outputs.value }}
          files: dist/eSignASPLibrary5_5.jar
          generate_release_notes: true
