name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Ant
        # Four JARs in project.properties have hardcoded Windows paths.
        # Override them here so the Linux runner uses the lib/ copies instead.
        run: |
          ant clean jar \
            -Dfile.reference.batik-all-1.13.jar=lib/batik-all-1.13.jar \
            -Dfile.reference.commons-io-2.4.jar=lib/commons-io-2.4.jar \
            -Dfile.reference.org.w3c.dom.svg-1.1.0.jar=lib/org.w3c.dom.svg-1.1.0.jar \
            -Dfile.reference.xmlgraphics-commons-2.4.jar=lib/xmlgraphics-commons-2.4.jar
